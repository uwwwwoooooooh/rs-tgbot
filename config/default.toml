[llm]
# --- LM Studio Configuration (Active) ---
url = "http://127.0.0.1:1234/v1/chat/completions"
model = "local-model"

# --- MiniMax Configuration (Disabled) ---
# Uncomment the following to use MiniMax, and comment out LM Studio above
# url = "https://api.minimax.io/v1/chat/completions"
# model = "MiniMax-M2.7"

# Temperature (0.0 - 2.0)
temperature = 0.7

# Top-p sampling (0.0 - 1.0)
top_p = 0.9

# Maximum completion tokens
max_completion_tokens = 2048
